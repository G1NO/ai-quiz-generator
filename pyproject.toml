[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quiz-generator"
version = "0.2.0"
description = "Draft multiple-choice quiz questions from training content with AI, using instructional design best practices."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gino DeFalco" }]
keywords = ["instructional-design", "elearning", "assessment", "quiz", "llm", "moodle", "gift"]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
diagnostic = ["pydantic>=2.6", "anthropic>=0.40"]
web = ["pydantic>=2.6", "anthropic>=0.40", "streamlit>=1.40", "pandas>=2.0", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
quizgen = "quizgen.cli:main"

[tool.setuptools]
packages = ["quizgen", "quizgen.diagnostic"]

[tool.setuptools.package-data]
"quizgen.diagnostic" = ["demo_project.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
