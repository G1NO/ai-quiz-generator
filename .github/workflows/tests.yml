name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[dev,diagnostic]"
      - run: pytest -q
      - name: Demo run
        run: quizgen generate examples/sample-training.md --demo -f md -f html -f gift -f csv --out /tmp/quiz
      - name: Diagnostic demo run
        run: quizgen diagnose examples/diagnostic/ai-at-work.txt --demo --out /tmp/diag
